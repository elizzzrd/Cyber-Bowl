[platformio]
default_envs = camera

[env:camera]
platform = espressif32 @ 6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra


monitor_dtr = 0 
monitor_rts = 0 
